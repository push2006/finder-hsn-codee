name: Apply reviewed HSN replacement package
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hsn-reviewed-replacement
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact reviewed files
        env:
          PACKAGE_URL: https://litter.catbox.moe/b67qpp.zip
        run: |
          set -euo pipefail
          baseline=89f4fe7c940fb458ff8a59e6ddaf0259f6480c71
          test "$(git rev-parse HEAD^)" = "$baseline"
          test "$(git diff --name-only "$baseline" HEAD)" = '.github/workflows/deploy-update.yml'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          curl --fail --location --retry 2 "$PACKAGE_URL" -o /tmp/package.zip
          echo '43cf27578d3088e5b826f5c3dea15a15f7582dba6bab9bc9fc331d3044d3c438  /tmp/package.zip' | sha256sum -c -
          unzip -q /tmp/package.zip -d /tmp/replacement
          package=/tmp/replacement/finder-update-2026-09-30-replacement
          for file in data.99ccac6947ad.js offline.html src/app.js src/gstmap.ts monitor.mjs sw.js index.html; do
            test -f "$package/$file"
            cp "$package/$file" "$file"
            git add -- "$file"
          done
          git rm -- data.bae29495cf6f.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply reviewed GST and US Chapter 97 replacement package'
          git push origin HEAD:main
