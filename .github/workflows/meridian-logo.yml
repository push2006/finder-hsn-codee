              assert not any(Path(n).exists() for n in allowed), 'Branding path exists; review required'
              z.extractall('.')
          tags='<link rel="icon" href="/branding/favicon.ico" sizes="16x16 32x32 48x48">\n<link rel="icon" type="image/png" sizes="48x48" href="/branding/icon-48.png">\n<link rel="apple-touch-icon" sizes="180x180" href="/branding/apple-touch-icon.png">\n<meta property="og:image" content="https://finder-hsn-codee.onrender.com/branding/og-image.png">\n<meta property="og:image:width" content="1200">\n<meta property="og:image:height" content="630">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="Worldwide HSN Code Finder">\n<meta name="twitter:description" content="Trade-code finder with official code descriptions and duty context.">\n<meta name="twitter:image" content="https://finder-hsn-codee.onrender.com/branding/og-image.png">'
          for name in ('index.html','build.mjs'):
              p=Path(name);s=p.read_text();assert '<head>' in s
              assert s.index('<head>') < s.index('</head>') < s.index('<body')
              p.write_text(s.replace('</head>',tags+'\n</head>',1))
          assert 'https://finder-hsn-codee.onrender.com/' in Path('index.html').read_text()
          PY
      - name: Verify additive change scope
        run: |
          node --check build.mjs
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          assert changed=={'index.html','build.mjs'}, changed
          PY
      - name: Commit logo and retire workflow
        run: |
          rm .github/workflows/meridian-logo.yml
          git config user.name 'finder-maintenance-bot'
          git config user.email 'maintenance@users.noreply.github.com'
          git add index.html build.mjs branding .github/workflows/meridian-logo.yml
          git commit -m 'Add selected Meridian favicon and social branding'
          git push
